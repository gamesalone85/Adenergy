<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Stock TI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container py-5">

<h1 class="mb-4">
Stock Refacciones
</h1>

<div class="card shadow-lg mb-4">

<div class="card-body">

<form id="stockForm">

<div class="row g-3">

<div class="col-md-4">

<input type="text"
       id="pieza"
       class="form-control"
       placeholder="Pieza">

</div>

<div class="col-md-4">

<input type="number"
       id="cantidad"
       class="form-control"
       placeholder="Cantidad">

</div>

<div class="col-md-4">

<button class="btn btn-primary w-100">

Guardar

</button>

</div>

</div>

</form>

</div>

</div>

<table class="table table-hover">

<thead class="table-dark">

<tr>

<th>Pieza</th>
<th>Cantidad</th>

</tr>

</thead>

<tbody id="stockTable"></tbody>

</table>

</div>

<script>

const stock =
    JSON.parse(localStorage.getItem("stock")) || [];

const table =
    document.getElementById("stockTable");

function render(){

    table.innerHTML = "";

    stock.forEach(s => {

        table.innerHTML += `

            <tr>

                <td>${s.pieza}</td>

                <td>${s.cantidad}</td>

            </tr>

        `;
    });
}

document.getElementById("stockForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    stock.push({

        pieza:
            document.getElementById("pieza").value,

        cantidad:
            document.getElementById("cantidad").value

    });

    localStorage.setItem(
        "stock",
        JSON.stringify(stock)
    );

    render();

    this.reset();
});

render();

</script>

</body>
</html>

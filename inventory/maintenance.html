<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Mantenimientos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container py-5">

<h1 class="mb-4">
Mantenimientos
</h1>

<div class="card shadow-lg">

<div class="card-body">

<form id="maintenanceForm">

<div class="row g-3">

<div class="col-md-4">

<input type="text"
       id="activo"
       class="form-control"
       placeholder="ID Activo">

</div>

<div class="col-md-4">

<select id="tipo"
        class="form-select">

<option>Preventivo</option>
<option>Correctivo</option>

</select>

</div>

<div class="col-md-4">

<input type="date"
       id="fecha"
       class="form-control">

</div>

<div class="col-12">

<textarea id="detalle"
          class="form-control"
          rows="4"
          placeholder="Detalle"></textarea>

</div>

<div class="col-12 text-end">

<button class="btn btn-primary">

Guardar

</button>

</div>

</div>

</form>

</div>

</div>

</div>

</body>
</html>

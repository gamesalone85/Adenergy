<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mantenimientos TI | Adenergy</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet">

<!-- INVENTORY CSS -->
<link rel="stylesheet"
      href="inventory.css">

</head>

<body>

<div class="container py-5">

    <!-- HEADER -->
    <div class="inventory-header">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-4">

            <div>

                <h1>

                    <i class="bi bi-tools"></i>

                    Mantenimientos TI

                </h1>

                <p>

                    Gestión y seguimiento de mantenimientos preventivos y correctivos

                </p>

            </div>

            <!-- BOTONES -->
            <div class="d-flex gap-2 flex-wrap justify-content-end">

                <a href="index.html"
                   class="btn btn-dark">

                    <i class="bi bi-arrow-left"></i>

                    Volver Inventario

                </a>

                <a href="../support/admin.html"
                   class="btn btn-success">

                    <i class="bi bi-house-fill"></i>

                    Panel Tickets

                </a>

            </div>

        </div>

    </div>

    <!-- FORM -->
    <div class="card shadow-lg">

        <div class="card-body p-4">

            <h4 class="mb-4">

                Registrar Mantenimiento

            </h4>

            <form id="maintenanceForm">

                <div class="row g-4">

                    <!-- ID ACTIVO -->
                    <div class="col-md-4">

                        <label class="form-label">

                            ID Activo

                        </label>

                        <input type="text"
                               id="activo"
                               class="form-control"
                               placeholder="Ejemplo: ADE-0001">

                    </div>

                    <!-- TIPO -->
                    <div class="col-md-4">

                        <label class="form-label">

                            Tipo de Mantenimiento

                        </label>

                        <select id="tipo"
                                class="form-select">

                            <option>
                                Preventivo
                            </option>

                            <option>
                                Correctivo
                            </option>

                        </select>

                    </div>

                    <!-- FECHA -->
                    <div class="col-md-4">

                        <label class="form-label">

                            Fecha

                        </label>

                        <input type="date"
                               id="fecha"
                               class="form-control">

                    </div>

                    <!-- DETALLE -->
                    <div class="col-12">

                        <label class="form-label">

                            Detalle

                        </label>

                        <textarea id="detalle"
                                  class="form-control"
                                  rows="5"
                                  placeholder="Describe el mantenimiento realizado"></textarea>

                    </div>

                    <!-- BOTON -->
                    <div class="col-12 text-end">

                        <button class="btn btn-primary btn-lg">

                            <i class="bi bi-save-fill"></i>

                            Guardar Mantenimiento

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>

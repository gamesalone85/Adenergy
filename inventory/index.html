<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inventario TI | Adenergy</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>

        body{
            background:#f4f7fb;
        }

        .card{
            border:none;
            border-radius:20px;
        }

        .form-control,
        .form-select{
            border-radius:12px;
            padding:12px;
        }

        .btn{
            border-radius:12px;
        }

        .table{
            border-radius:12px;
            overflow:hidden;
        }

        .badge-status{
            padding:8px 14px;
            border-radius:20px;
            font-size:12px;
        }

        .asset-id{
            font-weight:bold;
            color:#0d6efd;
        }

    </style>

</head>
    
<body>

<div class="container py-5">

    <!-- HEADER -->
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

    <div>

        <h1 class="fw-bold">

            <i class="bi bi-pc-display-horizontal"></i>

            Inventario TI

        </h1>

        <p class="text-muted mb-0">

            Administración de activos tecnológicos

        </p>

    </div>

    <!-- BOTONES -->
    <div class="d-flex gap-2 flex-wrap justify-content-end">

        <a href="../support/admin.html"
           class="btn btn-dark">

            <i class="bi bi-house-fill"></i>

            Volver a Tickets

        </a>

        <button class="btn btn-success"
                onclick="exportarExcel()">

            <i class="bi bi-file-earmark-excel-fill"></i>

            Exportar Excel

        </button>

        <a href="stock.html"
           class="btn btn-warning">

            <i class="bi bi-box-seam"></i>

            Stock

        </a>

        <a href="maintenance.html"
           class="btn btn-primary">

            <i class="bi bi-tools"></i>

            Mantenimientos

        </a>

        <a href="reports.html"
           class="btn btn-success">

            <i class="bi bi-bar-chart-fill"></i>

            Reportes

        </a>

    </div>

</div>

</div>

    <!-- KPIS -->
    <div class="row g-4 mb-4">

        <div class="col-md-3">

            <div class="card shadow">

                <div class="card-body">

                    <h6 class="text-muted">
                        Equipos Totales
                    </h6>

                    <h2 id="kpiTotal">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow">

                <div class="card-body">

                    <h6 class="text-muted">
                        Asignados
                    </h6>

                    <h2 id="kpiAsignados">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow">

                <div class="card-body">

                    <h6 class="text-muted">
                        Disponibles
                    </h6>

                    <h2 id="kpiDisponibles">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow">

                <div class="card-body">

                    <h6 class="text-muted">
                        En Reparación
                    </h6>

                    <h2 id="kpiReparacion">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

    <!-- FORM -->
    <div class="card shadow-lg mb-5">

        <div class="card-body p-4">

            <h4 class="mb-4">

                Registrar Equipo

            </h4>

            <form id="inventoryForm">

                <div class="row g-4">

                    <!-- ID -->
                    <div class="col-md-4">

                        <label class="form-label">
                            ID Activo
                        </label>

                        <input type="text"
                               id="assetId"
                               class="form-control"
                               readonly>

                    </div>

                    <!-- TIPO -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Tipo de Equipo
                        </label>

                        <select id="tipo"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccionar
                            </option>

                            <option>
                                Laptop
                            </option>

                            <option>
                                Desktop
                            </option>

                            <option>
                                Monitor
                            </option>

                            <option>
                                Celular
                            </option>

                            <option>
                                Impresora
                            </option>

                            <option>
                                Disco Duro
                            </option>

                            <option>
                                SSD
                            </option>

                            <option>
                                RAM
                            </option>

                            <option>
                                Toner
                            </option>

                        </select>

                    </div>

                    <!-- MARCA -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Marca
                        </label>

                        <select id="marca"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccionar
                            </option>

                        </select>

                    </div>

                    <!-- MODELO -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Modelo
                        </label>

                        <select id="modelo"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccionar
                            </option>

                        </select>

                    </div>

                    <!-- SERIE -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Número de Serie
                        </label>

                        <input type="text"
                               id="serie"
                               class="form-control"
                               required>

                    </div>

                    <!-- ESTADO -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Estado
                        </label>

                        <select id="estado"
                                class="form-select">

                            <option>
                                Disponible
                            </option>

                            <option>
                                Asignado
                            </option>

                            <option>
                                Reparación
                            </option>

                            <option>
                                Baja
                            </option>

                        </select>

                    </div>

                    <!-- DIVISION -->
                    <div class="col-md-4">

                        <label class="form-label">
                            División
                        </label>

                        <select id="division"
                                class="form-select">

                            <option>
                                Adenergy
                            </option>

                            <option>
                                Ducter
                            </option>

                            <option>
                                Nietofin
                            </option>

                        </select>

                    </div>

                    <!-- USUARIO -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Usuario Asignado
                        </label>

                        <input type="text"
                               id="usuario"
                               class="form-control">

                    </div>

                    <!-- UBICACION -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Ubicación
                        </label>

                        <input type="text"
                               id="ubicacion"
                               class="form-control">

                    </div>

                    <!-- OBS -->
                    <div class="col-12">

                        <label class="form-label">
                            Observaciones
                        </label>

                        <textarea id="observaciones"
                                  class="form-control"
                                  rows="4"></textarea>

                    </div>

                    <!-- BTN -->
                    <div class="col-12 text-end">

                        <button class="btn btn-primary btn-lg"
                                type="submit">

                            <i class="bi bi-save-fill"></i>

                            Guardar Equipo

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- GRAFICAS -->
    <div class="row g-4 mb-4">

        <div class="col-lg-6">

            <div class="card shadow-lg">

                <div class="card-body">

                    <h5 class="mb-4">
                        Equipos por Tipo
                    </h5>

                    <canvas id="chartTipos"></canvas>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-lg">

                <div class="card-body">

                    <h5 class="mb-4">
                        Estado de Equipos
                    </h5>

                    <canvas id="chartEstados"></canvas>

                </div>

            </div>

        </div>

    </div>

    <!-- TABLA -->
    <div class="card shadow-lg">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

                <h4 class="mb-0">
                    Inventario Registrado
                </h4>

                <input type="text"
                       id="searchInput"
                       class="form-control w-auto"
                       placeholder="Buscar equipo...">

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Tipo</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Serie</th>
                            <th>Estado</th>
                            <th>Usuario</th>
                            <th>División</th>

                        </tr>

                    </thead>

                    <tbody id="inventoryTable"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

const modelos = {

    Laptop: {

        Dell: [
            "Latitude 5420",
            "Latitude 5430"
        ],

        Lenovo: [
            "ThinkPad T14"
        ]

    },

    Monitor: {

        Dell: [
            "P2422H"
        ],

        Samsung: [
            "Odyssey G5"
        ]

    },

    Celular: {

        Samsung: [
            "Galaxy S24"
        ],

        Apple: [
            "iPhone 15"
        ]

    },

    Impresora: {

        HP: [
            "LaserJet Pro"
        ],

        Brother: [
            "DCP-L2550DW"
        ]

    }

};

const tipo =
    document.getElementById("tipo");

const marca =
    document.getElementById("marca");

const modelo =
    document.getElementById("modelo");

const table =
    document.getElementById("inventoryTable");

let inventario =
    JSON.parse(localStorage.getItem("inventario")) || [];

// =======================
// ID AUTOMATICO
// =======================

function generarID(){

    const numero =
        inventario.length + 1;

    return "ADE-" +
           numero.toString().padStart(4,"0");
}

document.getElementById("assetId").value =
    generarID();

// =======================
// AUTOCOMPLETE
// =======================

tipo.addEventListener("change", function(){

    marca.innerHTML =
        `<option value="">Seleccionar</option>`;

    modelo.innerHTML =
        `<option value="">Seleccionar</option>`;

    if(!modelos[this.value]) return;

    Object.keys(modelos[this.value]).forEach(m => {

        marca.innerHTML += `

            <option>${m}</option>

        `;
    });
});

marca.addEventListener("change", function(){

    modelo.innerHTML =
        `<option value="">Seleccionar</option>`;

    const modelosMarca =
        modelos[tipo.value][this.value];

    modelosMarca.forEach(mod => {

        modelo.innerHTML += `

            <option>${mod}</option>

        `;
    });
});

// =======================
// GUARDAR
// =======================

document.getElementById("inventoryForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const equipo = {

        id:
            document.getElementById("assetId").value,

        tipo:
            tipo.value,

        marca:
            marca.value,

        modelo:
            modelo.value,

        serie:
            document.getElementById("serie").value,

        estado:
            document.getElementById("estado").value,

        division:
            document.getElementById("division").value,

        usuario:
            document.getElementById("usuario").value,

        ubicacion:
            document.getElementById("ubicacion").value,

        observaciones:
            document.getElementById("observaciones").value

    };

    inventario.push(equipo);

    localStorage.setItem(
        "inventario",
        JSON.stringify(inventario)
    );

    renderInventario();

    this.reset();

    document.getElementById("assetId").value =
        generarID();
});

// =======================
// RENDER
// =======================

function renderInventario(data = inventario){

    table.innerHTML = "";

    data.slice().reverse().forEach(eq => {

        table.innerHTML += `

            <tr>

                <td class="asset-id">
                    ${eq.id}
                </td>

                <td>${eq.tipo}</td>

                <td>${eq.marca}</td>

                <td>${eq.modelo}</td>

                <td>${eq.serie}</td>

                <td>

                    <span class="badge bg-primary badge-status">

                        ${eq.estado}

                    </span>

                </td>

                <td>${eq.usuario || "-"}</td>

                <td>${eq.division}</td>

            </tr>

        `;
    });

    actualizarKPIs();

    renderCharts();
}

// =======================
// KPIS
// =======================

function actualizarKPIs(){

    document.getElementById("kpiTotal")
    .textContent =
        inventario.length;

    document.getElementById("kpiAsignados")
    .textContent =
        inventario.filter(
            e => e.estado === "Asignado"
        ).length;

    document.getElementById("kpiDisponibles")
    .textContent =
        inventario.filter(
            e => e.estado === "Disponible"
        ).length;

    document.getElementById("kpiReparacion")
    .textContent =
        inventario.filter(
            e => e.estado === "Reparación"
        ).length;
}

// =======================
// GRAFICAS
// =======================

function renderCharts(){

    const tipos = {};

    inventario.forEach(eq => {

        tipos[eq.tipo] =
            (tipos[eq.tipo] || 0) + 1;
    });

    const estados = {};

    inventario.forEach(eq => {

        estados[eq.estado] =
            (estados[eq.estado] || 0) + 1;
    });

    if(window.chartTiposObj)
        window.chartTiposObj.destroy();

    if(window.chartEstadosObj)
        window.chartEstadosObj.destroy();

    window.chartTiposObj =
        new Chart(
            document.getElementById("chartTipos"),
            {
                type:"bar",

                data:{

                    labels:Object.keys(tipos),

                    datasets:[{

                        label:"Equipos",

                        data:Object.values(tipos)

                    }]
                }
            }
        );

    window.chartEstadosObj =
        new Chart(
            document.getElementById("chartEstados"),
            {
                type:"doughnut",

                data:{

                    labels:Object.keys(estados),

                    datasets:[{

                        data:Object.values(estados)

                    }]
                }
            }
        );
}

// =======================
// BUSQUEDA
// =======================

document.getElementById("searchInput")
.addEventListener("keyup", function(){

    const value =
        this.value.toLowerCase();

    const filtrados =
        inventario.filter(eq =>

            eq.id.toLowerCase().includes(value) ||
            eq.tipo.toLowerCase().includes(value) ||
            eq.marca.toLowerCase().includes(value) ||
            eq.modelo.toLowerCase().includes(value)

        );

    renderInventario(filtrados);
});

// =======================
// EXPORTAR
// =======================

function exportarExcel(){

    const worksheet =
        XLSX.utils.json_to_sheet(inventario);

    const workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Inventario"
    );

    XLSX.writeFile(
        workbook,
        "Inventario_TI.xlsx"
    );
}

renderInventario();

</script>

</body>
</html>

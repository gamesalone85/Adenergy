<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Reportes TI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container py-5">

<h1 class="mb-5">
Reportes y KPIs
</h1>

<div class="row g-4">

<div class="col-lg-6">

<div class="card shadow-lg">

<div class="card-body">

<h4>
Equipos por Marca
</h4>

<canvas id="chartMarca"></canvas>

</div>

</div>

</div>

<div class="col-lg-6">

<div class="card shadow-lg">

<div class="card-body">

<h4>
Equipos por Estado
</h4>

<canvas id="chartEstado"></canvas>

</div>

</div>

</div>

</div>

</div>

<script>

const inventario =
    JSON.parse(localStorage.getItem("inventario")) || [];

const marcas = {};
const estados = {};

inventario.forEach(eq => {

    marcas[eq.marca] =
        (marcas[eq.marca] || 0) + 1;

    estados[eq.estado] =
        (estados[eq.estado] || 0) + 1;
});

new Chart(

    document.getElementById("chartMarca"),

    {

        type:"bar",

        data:{

            labels:Object.keys(marcas),

            datasets:[{

                label:"Equipos",

                data:Object.values(marcas)

            }]
        }
    }
);

new Chart(

    document.getElementById("chartEstado"),

    {

        type:"pie",

        data:{

            labels:Object.keys(estados),

            datasets:[{

                data:Object.values(estados)

            }]
        }
    }
);

</script>

</body>
</html>

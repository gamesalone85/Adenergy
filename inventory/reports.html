<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stock TI | Adenergy</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet">

<!-- INVENTORY CSS -->
<link rel="stylesheet"
      href="inventory.css">

</head>

<body>

<div class="container py-5">

    <!-- HEADER -->
    <div class="inventory-header">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-4">

            <div>

                <h1>

                    <i class="bi bi-box-seam-fill"></i>

                    Stock TI

                </h1>

                <p>

                    Control y administración de refacciones tecnológicas

                </p>

            </div>

            <!-- BOTONES -->
            <div class="d-flex gap-2 flex-wrap justify-content-end">

                <a href="index.html"
                   class="btn btn-dark">

                    <i class="bi bi-arrow-left"></i>

                    Volver Inventario

                </a>

                <a href="../support/admin.html"
                   class="btn btn-success">

                    <i class="bi bi-house-fill"></i>

                    Panel Tickets

                </a>

            </div>

        </div>

    </div>

    <!-- FORM -->
    <div class="card shadow-lg mb-4">

        <div class="card-body p-4">

            <h4 class="mb-4">

                Registrar Refacción

            </h4>

            <form id="stockForm">

                <div class="row g-4">

                    <!-- PIEZA -->
                    <div class="col-md-5">

                        <label class="form-label">

                            Pieza / Refacción

                        </label>

                        <input type="text"
                               id="pieza"
                               class="form-control"
                               placeholder="Ejemplo: SSD Kingston 1TB">

                    </div>

                    <!-- CANTIDAD -->
                    <div class="col-md-4">

                        <label class="form-label">

                            Cantidad

                        </label>

                        <input type="number"
                               id="cantidad"
                               class="form-control"
                               placeholder="0">

                    </div>

                    <!-- BOTON -->
                    <div class="col-md-3 d-flex align-items-end">

                        <button class="btn btn-primary w-100">

                            <i class="bi bi-save-fill"></i>

                            Guardar

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- TABLA -->
    <div class="card shadow-lg">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

                <h4 class="mb-0">

                    Refacciones Registradas

                </h4>

                <input type="text"
                       id="searchInput"
                       class="form-control w-auto"
                       placeholder="Buscar refacción...">

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>
                                Pieza
                            </th>

                            <th>
                                Cantidad
                            </th>

                        </tr>

                    </thead>

                    <tbody id="stockTable"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

const stock =
    JSON.parse(localStorage.getItem("stock")) || [];

const table =
    document.getElementById("stockTable");

function render(data = stock){

    table.innerHTML = "";

    data.slice().reverse().forEach(s => {

        table.innerHTML += `

            <tr>

                <td>

                    <strong>
                        ${s.pieza}
                    </strong>

                </td>

                <td>

                    <span class="badge-status badge-disponible">

                        ${s.cantidad} piezas

                    </span>

                </td>

            </tr>

        `;
    });
}

document.getElementById("stockForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    stock.push({

        pieza:
            document.getElementById("pieza").value,

        cantidad:
            document.getElementById("cantidad").value

    });

    localStorage.setItem(
        "stock",
        JSON.stringify(stock)
    );

    render();

    this.reset();
});

/* ======================================================
   BUSQUEDA
====================================================== */

document.getElementById("searchInput")
.addEventListener("keyup", function(){

    const value =
        this.value.toLowerCase();

    const filtrados =
        stock.filter(s =>

            s.pieza.toLowerCase().includes(value)

        );

    render(filtrados);
});

render();

</script>

</body>
</html>

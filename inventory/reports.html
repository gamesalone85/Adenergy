<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reportes TI | Adenergy</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet">

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- CSS -->
<link rel="stylesheet" href="inventory.css">

</head>

<body>

<div class="inventory-wrapper">

<div class="container py-5">

    <!-- HEADER -->
    <div class="inventory-header mb-5">

        <div>

            <h1 class="inventory-title">

                <i class="bi bi-bar-chart-line-fill"></i>

                Reportes TI

            </h1>

            <p class="inventory-subtitle mb-0">

                Indicadores estratégicos y métricas operativas del inventario tecnológico

            </p>

        </div>

        <!-- BOTONES -->
        <div class="inventory-actions">

            <a href="index.html"
               class="btn btn-adenergy-secondary">

                <i class="bi bi-arrow-left-circle-fill"></i>

                Volver a Inventario

            </a>

            <button class="btn btn-adenergy-primary"
                    onclick="window.print()">

                <i class="bi bi-printer-fill"></i>

                Imprimir Reporte

            </button>

        </div>

    </div>

    <!-- KPIS -->
    <div class="row g-4 mb-5">

        <div class="col-md-3">

            <div class="inventory-card kpi-card">

                <div class="card-body">

                    <div class="kpi-icon">

                        <i class="bi bi-pc-display"></i>

                    </div>

                    <h6 class="kpi-label">
                        Equipos Registrados
                    </h6>

                    <h2 id="kpiTotal">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="inventory-card kpi-card">

                <div class="card-body">

                    <div class="kpi-icon">

                        <i class="bi bi-person-check-fill"></i>

                    </div>

                    <h6 class="kpi-label">
                        Equipos Asignados
                    </h6>

                    <h2 id="kpiAsignados">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="inventory-card kpi-card">

                <div class="card-body">

                    <div class="kpi-icon">

                        <i class="bi bi-check-circle-fill"></i>

                    </div>

                    <h6 class="kpi-label">
                        Disponibles
                    </h6>

                    <h2 id="kpiDisponibles">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="inventory-card kpi-card">

                <div class="card-body">

                    <div class="kpi-icon">

                        <i class="bi bi-tools"></i>

                    </div>

                    <h6 class="kpi-label">
                        En Reparación
                    </h6>

                    <h2 id="kpiReparacion">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

    <!-- GRAFICAS -->
    <div class="row g-4">

        <!-- MARCAS -->
        <div class="col-lg-6">

            <div class="inventory-card">

                <div class="card-body p-4">

                    <div class="section-title mb-4">

                        <h4>

                            <i class="bi bi-building-fill"></i>

                            Equipos por Marca

                        </h4>

                    </div>

                    <canvas id="chartMarca"></canvas>

                </div>

            </div>

        </div>

        <!-- ESTADOS -->
        <div class="col-lg-6">

            <div class="inventory-card">

                <div class="card-body p-4">

                    <div class="section-title mb-4">

                        <h4>

                            <i class="bi bi-pie-chart-fill"></i>

                            Estado de Equipos

                        </h4>

                    </div>

                    <canvas id="chartEstado"></canvas>

                </div>

            </div>

        </div>

        <!-- DIVISIONES -->
        <div class="col-lg-6">

            <div class="inventory-card">

                <div class="card-body p-4">

                    <div class="section-title mb-4">

                        <h4>

                            <i class="bi bi-diagram-3-fill"></i>

                            Equipos por División

                        </h4>

                    </div>

                    <canvas id="chartDivision"></canvas>

                </div>

            </div>

        </div>

        <!-- TIPOS -->
        <div class="col-lg-6">

            <div class="inventory-card">

                <div class="card-body p-4">

                    <div class="section-title mb-4">

                        <h4>

                            <i class="bi bi-hdd-network-fill"></i>

                            Equipos por Tipo

                        </h4>

                    </div>

                    <canvas id="chartTipo"></canvas>

                </div>

            </div>

        </div>

    </div>

</div>

</div>

<script>

const inventario =
    JSON.parse(localStorage.getItem("inventario")) || [];

// =======================
// KPIS
// =======================

document.getElementById("kpiTotal")
.textContent =
    inventario.length;

document.getElementById("kpiAsignados")
.textContent =
    inventario.filter(
        eq => eq.estado === "Asignado"
    ).length;

document.getElementById("kpiDisponibles")
.textContent =
    inventario.filter(
        eq => eq.estado === "Disponible"
    ).length;

document.getElementById("kpiReparacion")
.textContent =
    inventario.filter(
        eq => eq.estado === "Reparación"
    ).length;

// =======================
// OBJETOS
// =======================

const marcas = {};
const estados = {};
const divisiones = {};
const tipos = {};

inventario.forEach(eq => {

    marcas[eq.marca] =
        (marcas[eq.marca] || 0) + 1;

    estados[eq.estado] =
        (estados[eq.estado] || 0) + 1;

    divisiones[eq.division] =
        (divisiones[eq.division] || 0) + 1;

    tipos[eq.tipo] =
        (tipos[eq.tipo] || 0) + 1;
});

// =======================
// CHART MARCAS
// =======================

new Chart(

    document.getElementById("chartMarca"),

    {

        type:"bar",

        data:{

            labels:Object.keys(marcas),

            datasets:[{

                label:"Equipos",

                data:Object.values(marcas),

                backgroundColor:"#c8102e",

                borderRadius:10

            }]
        },

        options:{

            responsive:true,

            plugins:{

                legend:{
                    display:false
                }
            }
        }
    }
);

// =======================
// CHART ESTADOS
// =======================

new Chart(

    document.getElementById("chartEstado"),

    {

        type:"doughnut",

        data:{

            labels:Object.keys(estados),

            datasets:[{

                data:Object.values(estados),

                backgroundColor:[

                    "#c8102e",
                    "#54565a",
                    "#00ae42",
                    "#d6d6d6"

                ]
            }]
        }
    }
);

// =======================
// CHART DIVISION
// =======================

new Chart(

    document.getElementById("chartDivision"),

    {

        type:"pie",

        data:{

            labels:Object.keys(divisiones),

            datasets:[{

                data:Object.values(divisiones),

                backgroundColor:[

                    "#c8102e",
                    "#54565a",
                    "#00ae42"

                ]
            }]
        }
    }
);

// =======================
// CHART TIPOS
// =======================

new Chart(

    document.getElementById("chartTipo"),

    {

        type:"bar",

        data:{

            labels:Object.keys(tipos),

            datasets:[{

                label:"Equipos",

                data:Object.values(tipos),

                backgroundColor:"#54565a",

                borderRadius:10

            }]
        },

        options:{

            responsive:true,

            plugins:{

                legend:{
                    display:false
                }
            }
        }
    }
);

</script>

</body>
</html>

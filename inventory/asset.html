<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activo TI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <a href="index.html"
       class="btn btn-dark mb-4">

       Volver

    </a>

    <div class="card shadow-lg">

        <div class="card-body p-4">

            <h2 id="assetTitle"></h2>

            <hr>

            <div id="assetDetail"></div>

        </div>

    </div>

</div>

<script>

const params =
    new URLSearchParams(window.location.search);

const id =
    params.get("id");

const inventario =
    JSON.parse(localStorage.getItem("inventario")) || [];

const equipo =
    inventario.find(e => e.id === id);

document.getElementById("assetTitle")
.innerText = equipo.id;

document.getElementById("assetDetail")
.innerHTML = `

    <div class="row g-4">

        <div class="col-md-6">
            <strong>Tipo:</strong>
            <p>${equipo.tipo}</p>
        </div>

        <div class="col-md-6">
            <strong>Marca:</strong>
            <p>${equipo.marca}</p>
        </div>

        <div class="col-md-6">
            <strong>Modelo:</strong>
            <p>${equipo.modelo}</p>
        </div>

        <div class="col-md-6">
            <strong>Serie:</strong>
            <p>${equipo.serie}</p>
        </div>

        <div class="col-md-6">
            <strong>Estado:</strong>
            <p>${equipo.estado}</p>
        </div>

        <div class="col-md-6">
            <strong>Usuario:</strong>
            <p>${equipo.usuario || "-"}</p>
        </div>

        <div class="col-md-6">
            <strong>Ubicación:</strong>
            <p>${equipo.ubicacion || "-"}</p>
        </div>

        <div class="col-md-6">
            <strong>División:</strong>
            <p>${equipo.division}</p>
        </div>

        <div class="col-12">
            <strong>Observaciones:</strong>
            <p>${equipo.observaciones || "-"}</p>
        </div>

    </div>

`;

</script>

</body>
</html>

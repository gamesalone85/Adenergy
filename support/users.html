<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios | Mesa de Ayuda</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="support.css">
    
    <link rel="stylesheet"
          href="admin.css">

</head>

<body>

<div class="container py-5">

    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

        <div>

            <h1 class="fw-bold">

                <i class="bi bi-people-fill"></i>

                Administración de Usuarios

            </h1>

            <p class="text-muted mb-0">

                Gestión de accesos y técnicos de soporte

            </p>

        </div>

        <div class="d-flex gap-2">

            <a href="admin.html"
               class="btn btn-dark">

                <i class="bi bi-arrow-left"></i>

                Volver

            </a>

        </div>

    </div>

    <!-- FORMULARIO -->

    <div class="card shadow-lg border-0 rounded-4 mb-4">

        <div class="card-body p-4">

            <h4 class="mb-4">

                Crear Usuario

            </h4>

            <form id="userForm">

                <div class="row g-4">

                    <!-- USUARIO -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Usuario

                        </label>

                        <input type="text"
                               id="usuario"
                               class="form-control"
                               required>

                    </div>

                    <!-- PASSWORD -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Contraseña

                        </label>

                        <input type="password"
                               id="password"
                               class="form-control"
                               required>

                    </div>

                    <!-- ROL -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Rol

                        </label>

                        <select id="rol"
                                class="form-select">

                            <option>
                                Administrador
                            </option>

                            <option selected>
                                Mesa de Ayuda
                            </option>

                            <option>
                                Supervisor
                            </option>

                        </select>

                    </div>

                    <!-- BOTÓN -->

                    <div class="col-12 text-end">

                        <button type="submit"
                                class="btn btn-primary btn-lg">

                            <i class="bi bi-person-plus-fill"></i>

                            Crear Usuario

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- TABLA -->

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body p-4">

            <h4 class="mb-4">

                Usuarios Registrados

            </h4>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Contraseña</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="usersTable"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="users.js"></script>

</body>
</html>

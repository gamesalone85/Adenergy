<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mesa de Ayuda | Adenergy</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="support.css">

</head>

<body>

<div class="container py-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

        <div>

            <h1 class="fw-bold">
                <i class="bi bi-ticket-detailed-fill"></i>
                Mesa de Ayuda
            </h1>

            <p class="text-muted mb-0">
                Registro de incidencias y soporte técnico
            </p>

        </div>

        <a href="../index.html" class="btn btn-dark">
            <i class="bi bi-house-fill"></i>
            Volver al Inicio
        </a>

    </div>

    <!-- FORMULARIO -->
    <div class="card shadow-lg border-0 rounded-4 mb-5">

        <div class="card-body p-4">

            <h4 class="mb-4">
                Crear Ticket
            </h4>

            <form id="ticketForm">

                <div class="row g-4">

                    <!-- USUARIO -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Nombre de Usuario
                        </label>

                        <input type="text"
                               class="form-control"
                               id="usuario"
                               required>

                    </div>

                    <!-- FECHA -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Fecha
                        </label>

                        <input type="text"
                               class="form-control"
                               id="fecha"
                               readonly>

                    </div>

                    <!-- TICKET -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Número de Ticket
                        </label>

                        <input type="text"
                               class="form-control"
                               id="ticket"
                               readonly>

                    </div>

                    <!-- DIVISION -->
                    <div class="col-md-6">

                        <label class="form-label">
                            División
                        </label>

                        <select class="form-select" id="division" required>

                            <option value="">
                                Seleccionar
                            </option>

                            <option>
                                Adenergy
                            </option>

                            <option>
                                Ducter
                            </option>

                            <option>
                                Nietofin
                            </option>

                        </select>

                    </div>

                    <!-- CATEGORIA -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Categoría
                        </label>

                        <select class="form-select" id="categoria" required>

                            <option value="">
                                Seleccionar
                            </option>

                            <option>
                                Windows
                            </option>

                            <option>
                                Telefonía Móvil
                            </option>

                            <option>
                                Correo Electrónico
                            </option>

                            <option>
                                VPN
                            </option>

                            <option>
                                Navegación en Internet
                            </option>

                            <option>
                                WIFI
                            </option>

                            <option>
                                Ethernet
                            </option>

                            <option>
                                Microsoft Teams
                            </option>

                            <option>
                                SharePoint
                            </option>

                            <option>
                                Hardware
                            </option>

                            <option>
                                Software
                            </option>

                            <option>
                                Impresoras
                            </option>

                        </select>

                    </div>

                    <!-- PRIORIDAD -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Prioridad
                        </label>

                        <select class="form-select" id="prioridad">

                            <option>
                                Baja
                            </option>

                            <option selected>
                                Media
                            </option>

                            <option>
                                Alta
                            </option>

                            <option>
                                Crítica
                            </option>

                        </select>

                    </div>

                    <!-- CONTACTO -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Correo / Contacto
                        </label>

                        <input type="text"
                               class="form-control"
                               id="contacto">

                    </div>

                    <!-- EQUIPO -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Equipo / Activo
                        </label>

                        <input type="text"
                               class="form-control"
                               id="equipo">

                    </div>

                    <!-- DESCRIPCION -->
                    <div class="col-12">

                        <label class="form-label">
                            Descripción del Problema
                        </label>

                        <textarea class="form-control"
                                  rows="5"
                                  id="descripcion"
                                  required></textarea>

                    </div>

                    <!-- BOTON -->
                    <div class="col-12 text-end">

                        <button type="submit"
                                class="btn btn-primary btn-lg">

                            <i class="bi bi-save-fill"></i>
                            Registrar Ticket

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- TABLA -->
    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body p-4">

            <h4 class="mb-4">
                Tickets Registrados
            </h4>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Ticket</th>
                            <th>Usuario</th>
                            <th>Fecha</th>
                            <th>División</th>
                            <th>Categoría</th>
                            <th>Prioridad</th>
                            <th>Estado</th>

                        </tr>

                    </thead>

                    <tbody id="ticketsTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="support.js"></script>

</body>
</html>

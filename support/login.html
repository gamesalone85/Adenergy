<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Mesa de Ayuda</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-5">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Mesa de Ayuda
                        </h2>

                        <p class="text-muted">
                            Acceso Administrativo prohibido el acceso no autorizado.
                        </p>

                    </div>

                    <form id="loginForm">

                        <div class="mb-4">

                            <label>
                                Usuario
                            </label>

                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-4">

                            <label>
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                required>

                        </div>

                        <button
                            class="btn btn-dark w-100 btn-lg"
                            type="submit">

                            Ingresar

                        </button>
                        <button
                            class="btn btn-dark w-100 btn-lg"
                            type="submit">

                            Salir

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
